name: Desktop release checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-release-check.yml'

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # No release secrets are exposed to PR builds, and nothing is published.
      SKIP_DMG: '1'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from package.json "packageManager"; passing it here too
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:release
      - name: Build macOS arm64 package
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          pnpm build:mac
      - name: Build Windows x64 package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-win.ps1
      - name: Packaged application workflows
        run: pnpm test:packaged
      - name: Windows installer workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/windows-installer-smoke.ps1
      - name: Windows cross-drive packaged workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/windows-cross-drive-smoke.ps1
      - name: Dump packaging evidence
        # 无论成败都落盘证据：asar 实际清单 + standalone/resources 目录布局。
        # release-validation 报"not found in this archive"时，靠它定位差异。
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          if (Test-Path dist\win-unpacked\resources) {
            "=== resources/ ===" | Out-File -Encoding utf8 test-results\packaging-evidence.txt
            Get-ChildItem dist\win-unpacked\resources | ForEach-Object { $_.Name } | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
            if (Test-Path dist\win-unpacked\resources\app.asar) {
              "=== app.asar entries (first 400) ===" | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
              node -e "const a=require('@electron/asar');const l=a.listPackage('dist/win-unpacked/resources/app.asar');console.log('total',l.length);console.log(l.slice(0,400).join('\n'))" | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
              "=== app.asar .next entries (first 200) ===" | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
              node -e "const a=require('@electron/asar');console.log(a.listPackage('dist/win-unpacked/resources/app.asar').filter(p=>p.includes('.next')).slice(0,200).join('\n'))" | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
            }
          }
          if (Test-Path .next\standalone) {
            "=== .next/standalone top level ===" | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
            Get-ChildItem .next\standalone | ForEach-Object { $_.Name } | Out-File -Append -Encoding utf8 test-results\packaging-evidence.txt
          }
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-check-${{ matrix.os }}
          path: |
            test-results/
            dist/latest*.yml
            dist/builder-debug.yml
          if-no-files-found: warn
