name: Desktop release checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-release-check.yml'

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # No release secrets are exposed to PR builds, and nothing is published.
      SKIP_DMG: '1'
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:release
      - name: Build macOS arm64 package
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          pnpm build:mac
      - name: Build Windows x64 package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-win.ps1
      - name: Packaged application workflows
        run: pnpm test:packaged
      - name: Windows installer workflows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/windows-installer-smoke.ps1
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-check-${{ matrix.os }}
          path: |
            test-results/
            dist/latest*.yml
            dist/builder-debug.yml
          if-no-files-found: warn
